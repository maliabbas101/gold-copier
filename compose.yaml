services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      PLATFORM_DB: /data/platform.db
    volumes:
      - copier-data:/data
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  discord:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ['python', '-m', 'goldcopier.discord_platform']
    env_file: .env
    environment:
      PLATFORM_DB: /data/platform.db
    volumes:
      - copier-data:/data
    restart: unless-stopped
    profiles: [discord]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true
volumes:
  copier-data:
