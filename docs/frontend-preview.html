let portfolioStream=null,liveTransport='connecting',livePolling=false,historyKey='',historyPoints=[],historyVersion=0,serverClockOffset=0,portfolioGeneration=0,lastPortfolioFrame=0,livePollController=null;

function liveLabel(){const a=account();if(publicDemo||config.demo)return ['Sample data','demo'];if(!a)return ['No account','gray'];if(a.disconnected)return ['Disconnected','gray'];if(!a.heartbeat)return ['Waiting for broker','gray'];const age=Math.max(0,Math.floor(brokerNow()-a.heartbeat));if(age>10)return [`Stale · ${age}s since broker update`,'red'];if(liveTransport==='connected'||liveTransport==='polling')return [`Live · updated ${age}s ago${a.snapshot.error?' · attention required':''}`,a.snapshot.error?'demo':''];return ['Reconnecting live feed','gray'];}
function liveBadge(){const [label,kind]=liveLabel();return `<span data-live-status role="status">${badge(label,kind)}</span>`;}
function updateLiveBadges(){const [label,kind]=liveLabel();document.querySelectorAll('[data-live-status]').forEach(el=>el.innerHTML=badge(label,kind));}
function stopPortfolioStream(){portfolioStream?.close();portfolioStream=null;liveTransport='connecting';}
function appendLiveEquity(){const a=account();if(!a||!a.heartbeat||!Number.isFinite(a.snapshot.equity)||historyKey!==`${a.id}:${chartPeriod}`)return;const bucket={LIVE:1,'1D':120,'7D':600,'30D':3600}[chartPeriod];const point={account_id:a.id,created:a.heartbeat,balance:a.snapshot.balance,equity:a.snapshot.equity};const last=historyPoints.at(-1);if(last&&point.created<last.created)return;if(last&&Math.floor(last.created/bucket)===Math.floor(point.created/bucket))historyPoints[historyPoints.length-1]=point;else historyPoints.push(point);const cutoff=brokerNow()-({LIVE:1800,'1D':86400,'7D':604800,'30D':2592000}[chartPeriod]);historyPoints=historyPoints.filter(p=>p.created>=cutoff).slice(-2000);}
async function loadEquity(force=false){const a=account();if(!a||publicDemo||config.demo)return;const key=`${a.id}:${chartPeriod}`;if(!force&&key===historyKey)return;const version=++historyVersion;const r=await api(`/portfolio/equity?account_id=${encodeURIComponent(a.id)}&period=${chartPeriod}`);if(version!==historyVersion||`${account()?.id}:${chartPeriod}`!==key||!current)return;historyKey=key;historyPoints=r.points||[];if(r.server_time)serverClockOffset=r.server_time-Date.now()/1000;appendLiveEquity();}
function renderLivePortfolio(){if(!current||!data||!livePages.includes(activePage)||!document.querySelector('.shell'))return;const focused=document.activeElement,id=focused?.id,caret=focused?.selectionStart,filter=document.querySelector('#trade-search')?.value;const container=document.querySelector('.content'),title=container.querySelector('.page-title'),footer=container.querySelector('.footer');const tableScroll=[...container.querySelectorAll('.table-wrap')].map(el=>el.scrollLeft);const template=document.createElement('template');template.innerHTML=({overview,accounts,trades,activity}[activePage])();const nextTitle=template.content.querySelector('.page-title');if(title&&nextTitle){const select=title.querySelector('#account-select'),nextSelect=nextTitle.querySelector('#account-select');if((select&&!nextSelect)||(!select&&nextSelect)){title.replaceWith(nextTitle);}else{if(select&&nextSelect){if(focused!==select)select.innerHTML=nextSelect.innerHTML;else if(![...nextSelect.options].some(o=>o.value===select.value))select.replaceWith(nextSelect);}nextTitle.remove();}}else if(nextTitle)container.prepend(nextTitle);for(const node of [...container.children])if(!node.classList.contains('page-title')&&node!==footer)node.remove();if(footer)footer.before(template.content);else container.append(template.content);container.querySelectorAll('.table-wrap').forEach((el,i)=>el.scrollLeft=tableScroll[i]||0);if(filter){const input=document.querySelector('#trade-search');if(input){input.value=filter;container.querySelectorAll('#history-table tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(filter.toLowerCase()));}}if(id){const next=document.getElementById(id);if(next&&next!==focused){next.focus({preventScroll:true});if(caret!=null&&next.setSelectionRange)next.setSelectionRange(caret,caret);}}const nav=document.querySelector('.nav a[href="#trades"]'),count=account()?.snapshot.positions?.length||0;if(nav){let pill=nav.querySelector('.pill');if(count){if(!pill){p function applyPortfolio(frame){if(!current||publicDemo||!frame.dashboard)return;lastPortfolioFrame=Date.now();const previous=new Map((data?.accounts||[]).map(a=>[a.id,a]));frame.dashboard.accounts.forEach(a=>{if(!a.snapshot.instruments)a.snapshot.instruments=previous.get(a.id)?.snapshot.instruments||[];});data={...data,...frame.dashboard};if(frame.server_time)serverClockOffset=frame.server_time-Date.now()/1000;appendLiveEquity();renderLivePortfolio();loadEquity().then(renderLivePortfolio).catch(()=>{});}
function syncPortfolioStream(){if(!current||publicDemo||config.demo||document.hidden||!livePages.includes(activePage)){stopPortfolioStream();return;}if(portfolioStream||typeof EventSource==='undefined')return;const source=new EventSource('/api/portfolio/stream');portfolioStream=source;source.onopen=()=>{if(source===portfolioStream){liveTransport='connected';lastPortfolioFrame=Date.now();updateLiveBadges();}};source.addEventListener('portfolio',event=>{if(source!==portfolioStream)return;try{applyPortfolio(JSON.parse(event.data));}catch{liveTransport='reconnecting';}});source.addEventListener('expired',()=>{if(source!==portfolioStream)return;clearSession();location.hash='login';route();});source.onerror=()=>{if(source===portfolioStream){liveTransport='reconnecting';updateLiveBadges();}};}

function chart(){const a=account();let points=(historyKey===`${a?.id}:${chartPeriod}`?historyPoints:(data.equity||[])).filter(p=>p.account_id===a?.id);const cutoff=brokerNow()-({LIVE:1800,'1D':86400,'7D':604800,'30D':2592000}[chartPeriod]);points=points.filter(p=>p.created>=cutoff).sort((a,b)=>a.created-b.created);if(points.length<2)return empty('Your equity curve starts here','Verified worker snapshots will appear after your terminal connects.');const vals=points.map(p=>p.equity),lo=Math.min(...vals),hi=Math.max(...vals),range=hi-lo||1,timeSpan=points.at(-1).created-points[0].created||1;const path=vals.map((v,i)=>`${i?'L':'M'}${((points[i].created-points[0].created)/timeSpan*700).toFixed(1)},${(hi===lo?85:155-(v-lo)/range*130).toFixed(1)}`).join(' ');return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 700 180" preserveAspectRatio="none" role="img" aria-label="Equity snapshots for selected account"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fa990" stop-opacity=".24"/><stop offset="100%" stop-color="#7fa990" stop-opacity="0"/></linearGradient></defs><path d="M0 25H700 M0 70H700 M0 115H700 M0 160H700" stroke="#ecf0ed" stroke-dasharray="4 5"/><path d="${path} L700 180 L0 180 Z" fill="url(#chartFill)"/><path d="${path}" fill="none" stroke="#58866e" stroke-width="2.4" vector-effect="non-scaling-stroke"/></svg><div class="chart-labels"><span>${esc(when(points[0].created))}</span><span>Account equity · ${esc(a.snapshot.currency||'USD')}</span><span>${esc(when(points.at(-1).created))}</span></div></div>`}
function accountSelect(){return data.accounts.length?`<select class="select mobile-select" id="account-select" aria-label="Selected MT5 account">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===account()?.id?'selected':''}>${esc(a.name)} · ${esc(a.login)}</option>`).join('')}</select>`:button('Connect account','connect','plus')}
function positionsTable(limit=50){const a=account(),positions=(a?.snapshot.positions||[]).slice(0,limit);if(!positions.length)return empty('No open positions','Positions appear after your worker verifies them with the broker.');return `<div class="table-wrap"><table><thead><tr><th>Instrument</th><th>Side / volume</th><th>Entry</th><th>Current price</th><th>SL / TP</th><th>Floating P&L</th><th>Manage</th></tr></thead><tbody>${positions.map(p=>`<tr><td><div class="symbol"><span class="symbol-mark">Au</span><div><strong>${esc(p.symbol)}</strong><small>#${esc(p.ticket)}</small></div></div></td><td>${badge(p.side,p.side==='BUY'?'':'red')} <small>${fmt(p.volume)} lots</small></td><td>${priceFmt(p.price_open)}</td><td>${priceFmt(p.price_current)}</td><td>${p.sl?priceFmt(p.sl):'—'} / ${p.tp?priceFmt(p.tp):'No TP'}</td><td class="${p.profit>=0?'positive':'negative'}">${p.profit==null?'Not reported':(p.profit>=0?'+':'')+fmt(p.profit)}</td><td>${p.copier?button('Manage','manage','settings','small',`data-ticket="${esc(p.ticket)}"`):'<small>External trade</small>'}</td></tr>`).join('')}</tbody></table></div>`}
function eventDetail(value){const [message,...technical]=String(value||'').split('\nTechnical details: ');return `<p>${esc(message).replaceAll('\n','<br>')}</p>${technical.length?`<details><summary>Technical details</summary><p class="mono">${esc(technical.join('\nTechnical details: '))}</p></details>`:''}`}
function recentEvents(limit=4){return data.events.length?data.events.slice(0,limit).map(e=>`<div class="feed-item"><span class="feed-icon">${icon(e.kind==='risk'?'risk':e.kind==='execution'?'check':e.kind==='alert'?'alert':'activity')}</span><div class="feed-text">${eventDetail(e.detail)}<small>${esc(e.kind.replaceAll('_',' '))}</small></div><time>${relative(e.created)}</time></div>`).join(''):empty('All quiet for now','Connection, signal, and execution events will appear here.')}
function overview(){const a=account(),s=a?.snapshot||{},cur=s.currency||'USD',positions=s.positions||[],risk=a?.risk;return `<div class="page-title"><div><div class="eyebrow">YOUR WORKSPACE AT A GLANCE</div><h1>Good to have you here, ${esc(current.name.split(' ')[0])}.</h1><p>Your community, your accounts, your control.</p></div><div class="actions">${accountSelect()}${button('Refresh','refresh','refresh')}</div></div>${config.demo?'<div class="banner">'+icon('alert')+'<span>Demo workspace · All balances, trades, and chart data are seeded examples. Broker execution is disabled.</span><a href="#settings">Environment details</a></div>':data.paused?'<div class="banner">'+icon('pause')+'<span>The operator has paused new entries. Existing trade protection remains active.</span></div>':''}<section class="stats"><article class="stat"><div class="stat-head">Account equity ${icon('wallet')}</div><div class="stat-value">${a?fmt(s.equity):'—'} <small>${esc(cur)}</small></div><div class="stat-bottom">${s.balance!==undefined?`Balance ${fmt(s.balance)} ${esc(cur)}`:'Awaiting broker verification'}</div></article><article class="stat"><div class="stat-head">Today’s realized P&L ${icon('trades')}</div><div class="stat-value ${s.daily_pnl>=0?'positive':'negative'}">${s.daily_pnl!=null?(s.daily_pnl>=0?'+':'')+fmt(s.daily_pnl):'—'}</div><div class="stat-bottom">Broker history · account currency</div></article><article class="stat"><div class="stat-head">Open positions ${icon('activity')}</div><div class="stat-value">${positions.length.toString().padStart(2,'0')}</div><div class="stat-bottom">${(s.orders||[]).length} pending orders <span>·</span> ${risk?.max_open||0} position limit</div></article><article class="stat"><div class="stat-head">Execution status ${icon('risk')}</div><div class="stat-value">${config.demo?'Demo':a?.enabled&&a.online?'Active':a?.online?'Paused':'Offline'}</div><div class="stat-bottom">${config.demo?'Simulation environment':a?.heartbeat?'Last heartbeat '+relative(a.heartbeat):'Connect your MT5 worker'}</div></article></section><section class="grid-main"><article class="panel"><div class="panel-head"><h2>Account performance</h2><div class="tabs">${['LIVE','1D','7D','30D'].map(t=>`<button class="${chartPeriod===t?'active':''}" data-action="chart-period" data-period="${t}">${t}</button>`).join('')}</div></div><div class="chart-top"><div><small>Equity history</small><div class="chart-total">${a?money(s.equity,cur):'—'}</div></div>${liveBadge()}</div>${chart()}</article><aside class="panel"><div class="panel-head"><h2>Connected account</h2><a href="#accounts">${icon('chevron')}</a></div><div class="panel-body">${a?`<div class="account-overview"><span class="broker-mark">${esc(a.broker[0])}</span><div><strong>${esc(a.name)}</strong><small>${esc(a.broker)} · MT5</small></div></div><div class="account-details"><div class="detail"><span>Account</span><strong>${esc(a.login)}</strong></div><div class="detail"><span>Server</span><strong>${esc(a.server)}</strong></div><div class="detail"><span>Account type</span>${badge(a.mode==='live'?'Live':'Demo',a.mode==='live'?'':'demo')}</div><div class="detail"><span>Hosting</span><strong>${a.hosting==='managed'?'Managed terminal':'Self-hosted worker'}</strong></div><div class="detail"><span>Risk per trade</span><strong>${fmt(a.risk.risk_pct,1)}% maximum</strong></div></div>${copyButton(a,'full primary')}`:empty('Let’s connect','Add your first MT5 account.','connect','Connect account')}</div></aside></section><section class="panel"><div class="panel-head"><h2>Open positions <small> / ${positions.length}</small></h2><a class="muted" href="#trades">All trades ${icon('chevron')}</a></div>${positionsTable(5)}<div class="table-foot"><span>${config.demo?'Illustrative positions':'Last verified '+when(a?.heartbeat)}</span><span>Configured broker instruments</span></div></section><section class="lower-grid"><article class="panel"><div class="panel-head"><h2>Recent activity</h2><a class="muted" href="#activity">View all ${icon('chevron')}</a></div>${recentEvents()}</article><article class="panel"><div class="panel-head"><h2>Your risk boundaries</h2><a class="muted" href="#risk">Edit ${icon('chevron')}</a></div><div class="panel-body"><div class="risk-summary"><div><p>Risk per trade cap</p><strong>${fmt(risk?.risk_pct||0,1)}%</strong></div><div><p>Daily loss stop</p><strong>${fmt(risk?.daily_loss_pct||0,1)}%</strong></div><div><p>Aggregate risk cap</p><strong>${fmt(risk?.total_risk_pct||0,1)}%</strong></div><div><p>Drawdown stop</p><strong>${fmt(risk?.drawdown_pct||0,1)}%</strong></div></div><progress class="meter" value="${Math.min(Math.max(-(s.daily_pnl||0),0)/(s.balance||1)*100,10)}" max="${risk?.daily_loss_pct||3}" aria-label="Realized daily loss relative to configured stop"></progress><small>Realized daily loss · monitoring requires a connected worker</small><p class="section-note">Limits can stop new entries. They do not guarantee a maximum realized loss.</p></div></article></section>`}
function autoLocal(a){return config.local_worker_available&&a.hosting==='self'&&(data.accounts.filter(x=>x.hosting==='self'&&!x.disconnected).length===1||config.master_worker_available)}
function copyButton(a,cls='primary'){if(a.purpose==='master')return button('Trader source · read-only','noop','link',cls,'disabled');const disabled=config.demo||a.disconnected||(a.mode==='live'&&!config.live_enabled)||(!a.enabled&&(!a.online||a.snapshot.error||!a.follows.length||data.paused));return button(a.enabled?'Pause copying':'Start copying','toggle-copy',a.enabled?'pause':'play',cls,`data-account="${a.id}" ${disabled?'disabled':''}`)}
function connectionStatus(a){if(a.purpose==='master'&&!a.disconnected)return a.online?'Watching trader':'Trader worker offline';if(a.disconnected)return 'Disconnected';if(a.connector==='exness'&&!config.live_enabled)return a.online?'Read-only API':'Waiting for API worker';return a.snapshot.error?'Connection problem':a.online?(a.enabled?'Copying':'Ready'):config.local_worker_available&&!a.heartbeat?'Connecting to MT5':'Offline'}
function accounts(){return `<div class="page-title"><div><div class="eyebrow">YOUR BROKER CONNECTIONS</div><h1>Trading accounts</h1><p>Connect MT5 or an eligible Exness API account, configure pairs, and choose your analyst.</p></div><div class="actions">${button('Connect MT5','connect','plus','primary')}${button('Exness API','connect-exness','link','',config.demo?'disabled':'')}</div></div><div class="cards">${data.accounts.map(a=>`<article class="panel account-card"><div class="panel-body"><div class="account-overview"><span class="broker-mark">${esc(a.broker[0])}</span><div><strong>${esc(a.name)}</strong><small>${esc(a.broker)} / ${esc(a.login)}</small></div>${badge(connectionStatus(a),a.snapshot.error?'red':a.online?'':'gray')}</div><div class="balance"><small>ACCOUNT EQUITY / ${esc(a.mode.toUpperCase())}</small>${a.snapshot.equity!==undefined?money(a.snapshot.equity,a.snapshot.currency):'Awaiting broker verification'}</div><div class="account-details"><div class="detail"><span>Server</span><strong>${esc(a.server)}</strong></div><div class="detail"><span>Mapped pairs</span><strong>${esc((a.pairs||[]).map(m=>m.pair).join(', ')||'Configure pairs')}</strong></div><div class="detail"><span>Analyst</span><strong>${esc(a.follows.map(f=>data.analysts.find(p=>p.id===f.analyst_id)?.name||'Analyst').join(', ')||'Choose an analyst')}</strong></div><div class="detail"><span>Risk cap per trade</span><strong>${fmt(a.risk.risk_pct,1)}%</strong></div></div>${config.local_worker_available&&a.hosting==='self'&&data.accounts.filter(x=>x.hosting==='self').length>1?`<p class="section-note">To use this account with the local terminal, set <code>LOCAL_ACCOUNT_ID=${esc(a.id)}</code> in .env and restart.</p>`:''}<p class="section-note">${a.purpose==='master'?esc(a.snapshot.source_status||'Configure the trader source in Operator console. This account never follows signals.'):a.disconnected?'Disconnected. Broker trades remain open and automated management has stopped.':a.snapshot.error?esc(a.snapshot.error):a.enabled&&a.online?'Copying is on. Waiting for the next valid signal.':a.connector==='exness'&&!config.live_enabled?'API connection is read-only. Live execution remains disabled.':!a.online?'Broker worker is connecting. This page updates automatically.':!a.follows.length?'Choose an analyst before starting.':'Broker connection is ready. Review your pairs and risk settings before starting.'}</p><div class="actions">${copyButton(a)}${a.purpose==='master'?button('Source setup','source-setup','settings','small',`data-account="${a.id}"`):button('Risk settings','account-risk','risk','small',`data-account="${a.id}"`)}${a.purpose!=='master'&&!a.follows.length?'<a class="btn small" href="#analysts">Choose analyst</a>':''}${autoLocal(a)?'':button('Worker setup','worker-setup','link','small',`data-account="${a.id}"`)}</div><div class="actions account-removal-actions">${button('Disconnect','disconnect','link','small',`data-account="${esc(a.id)}" ${a.disconnected?'disabled':''}`)}${button('Delete','delete-account','close','small danger',`data-account="${esc(a.id)}"`)}</div></div></article>`).join('')}<button class="add-card" data-action="connect">${icon('plus')}<strong>Connect another account</strong><p>Use a separate terminal for each simultaneous connection.</p></button></div>`}

function analysts(){const a=account();return `<div class="page-title"><div><div class="eyebrow">THE PEOPLE BEHIND THE SIGNALS</div><h1>Analyst directory</h1><p>Follow authorized feeds for the selected account. Configured instruments only.</p></div>${accountSelect()}</div>${data.analysts.length?`<div class="cards">${data.analysts.map(p=>{const followed=a?.follows.some(f=>f.analyst_id===p.id);return `<article class="panel analyst-card"><div class="analyst-art"><span class="avatar">${esc(initials(p.name))}</span><div><h2>${esc(p.name)}</h2><p>MULTI-INSTRUMENT · SIGNAL FEED</p></div></div><div class="panel-body"><p class="description">${esc(p.description||'A community analyst feed configured by the operator.')}</p><div class="chip-row">${badge(p.active?'Feed enabled':'Feed paused',p.active?'':'gray')}${followed?badge('Following'):''}</div><div class="actions">${button(followed?'Unfollow analyst':'Follow analyst','follow',followed?'check':'plus',followed?'':'primary',`data-analyst="${p.id}" ${!a||!p.active?'disabled':''}`)}${followed?`<a class="btn" href="#risk">Risk settings</a>`:''}</div></div></article>`}).join('')}</div>`:empty('No feeds configured','An operator can add the authorized Discord trader and channel in the operator console.')}<p class="section-note">Analysts do not have access to account credentials. Unfollowing is blocked while the account has open trades or pending orders so trade protection remains available.</p>`}
function riskPage(){const a=account();if(!a)return empty('Connect an account first','Risk settings belong to individual accounts.','connect','Connect account');const r=a.risk;return `<div class="page-title"><div><div class="eyebrow">BUILT AROUND YOUR BOUNDARIES</div><h1>Risk & execution</h1><p>Set the parameters the worker enforces before every new entry.</p></div>${accountSelect()}</div><div class="form-layout"><form id="risk-form" class="panel"><section class="form-section"><h3>Position sizing</h3><p>Choose your sizing method. The percentage cap applies to every method.</p><div class="form-grid"><div class="field"><label for="risk-scope">Apply settings to</label><select id="risk-scope" name="scope"><option value="">Account defaults</option>${a.follows.map(f=>`<option value="${f.analyst_id}">${esc(data.analysts.find(p=>p.id===f.analyst_id)?.name||'Analyst')} override</option>`).join('')}</select></div><div class="field"><label for="sizing">Sizing method</label><select id="sizing" name="sizing">${[['percent','Equity percentage'],['cash','Account-currency amount'],['fixed','Fixed lot size']].map(([v,l])=>`<option value="${v}" ${r.sizing===v?'selected':''}>${l}</option>`).join('')}</select></div>${fieldsNumber('Risk cap per trade (%)','risk_pct',r.risk_pct,'Maximum stop-loss exposure, across all sizing methods.','.1','.1','2')}${fieldsNumber('Cash risk budget','cash_risk',r.cash_risk,'In account currency units, including cent-account units.','1','.01')}${fieldsNumber('Fixed lot size','fixed_lots',r.fixed_lots,'Used only for fixed-lot sizing.','.01','.01','10')}${fieldsNumber('Maximum lot size','max_lots',r.max_lots,'Upper bound for every entry.','.01','.01','10')}</div></section><section class="form-section"><h3>Account protection</h3><p>These checks stop new entries when a boundary is reached.</p><div class="form-grid">${fieldsNumber('Daily equity loss stop (%)','daily_loss_pct',r.daily_loss_pct,'Measured from the worker’s persisted daily baseline.','.1','.1','10')}${fieldsNumber('Equity drawdown stop (%)','drawdown_pct',r.drawdown_pct,'Measured from the persisted equity high-water mark.','.1','.1','30')}${fieldsNumber('Aggregate open risk cap (%)','total_risk_pct',r.total_risk_pct,'Includes existing positions and pending orders.','.1','.1','10')}${fieldsNumber('Maximum concurrent positions & orders','max_open',r.max_open,'Dedicated hedging accounts are required.','1','1','10')}</div></section><section class="form-section"><h3>Targets & entry filters</h3><p>TP1/TP2 allocations apply to signals using multiple targets. Any remainder is a runner.</p><div class="form-grid">${fieldsNumber('TP1 close (%)','tp1_close_pct',r.tp1_close_pct,'Percentage of the original filled volume.','1','0','100')}${fieldsNumber('TP2 close (%)','tp2_close_pct',r.tp2_close_pct,'TP1 + TP2 must be at most 100%.','1','0','100')}${fieldsNumber('Maximum spread','max_spread',r.max_spread,'Legacy default; each pair mapping defines its spread limit.','.01','.01','20')}${fieldsNumber('Maximum entry distance','max_entry_distance',r.max_entry_distance,'Legacy default; configure entry tolerance in Trading pairs.','.01','.01','20')}<div class="field check"><input type="checkbox" id="be_enabled" name="be_enabled" ${r.be_enabled?'checked':''}><label for="be_enabled">Move SL to actual entry at the BE trigger</label></div><div class="field check"><input type="checkbox" id="respect_manual_stops" name="respect_manual_stops" ${r.respect_manual_stops?'checked':''}><label for="respect_manual_stops">Preserve manual SL/TP adjustments</label></div></div></section><div class="form-actions"><p>Changes apply to future entries.</p><button type="submit" class="btn primary">Save risk settings ${icon('check')}</button></div></form><aside><article class="panel"><div class="panel-head"><h2>Before you save</h2>${icon('risk')}</div><div class="panel-body"><p class="muted">Smaller lots, clearer limits.</p><ol class="checklist"><li>Risk is calculated using the broker’s contract and account currency.</li><li>Lots round down. Trades below the broker minimum are skipped.</li><li>A runner requires the worker to stay online for partial exits.</li><li>Stops can slip. No setting guarantees a maximum loss.</li></ol><p class="section-note">The worker verifies account identity, spread, quote freshness, and available exposure before submission.</p></div></article></aside></div>`}
function portfolioSummary(){const s=account()?.snapshot||{},positions=s.positions||[],floating=s.equity!=null&&positions.every(p=>p.profit!=null)?positions.reduce((total,p)=>total+p.profit,0):null;return `<section class="stats portfolio-summary">${[['Balance',s.balance],['Equity',s.equity],['Floating P&L',floating]].map(([label,value])=>`<article class="stat"><div class="stat-head">${label}</div><div class="stat-value">${value==null?'—':money(value,s.currency||'USD')}</div></article>`).join('')}<article class="stat"><div class="stat-head">Open positions / pending orders</div><div class="stat-value">${positions.length} / ${(s.orders||[]).length}</div></article></section>`}
function trades(){const a=account(),jobs=data.jobs.filter(j=>j.account_id===a?.id);return `<div class="page-title"><div><div class="eyebrow">EVERY COMMAND. EVERY OUTCOME.</div><h1>Trades & orders</h1><p>Broker snapshots and a durable execution trail.</p></div><div class="actions">${liveBadge()}${accountSelect()}${button('Refresh','refresh','refresh')}<a class="btn" href="/api/trades/export">${icon('download')}Export CSV</a></div></div>${portfolioSummary()}<section class="panel"><div class="panel-head"><h2>Open positions</h2>${liveBadge()}</div>${positionsTable()}</section><section class="panel section-gap"><div class="panel-head"><h2>Pending broker orders</h2></div>${a?.snapshot.orders?.length?`<div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Instrument</th><th>Type</th><th>Entry</th><th>Volume</th><th>Action</th></tr></thead><tbody>${a.snapshot.orders.map(o=>`<tr><td>#${esc(o.ticket)}</td><td>${esc(o.symbol)}</td><td>${esc(o.type)}</td><td>${fmt(o.price_open)}</td><td>${fmt(o.volume)}</td><td>${o.copier?button('Cancel','cancel-order','close','small',`data-ticket="${esc(o.ticket)}"`):'External order'}</td></tr>`).join('')}</tbody></table></div>`:empty('No pending orders','Limit and stop orders appear after broker acceptance.')}</section><section class="panel section-gap"><div class="panel-head"><h2>Today’s closed broker deals</h2><small>Account currency · last 100 reported deals</small></div>${a?.snapshot.deals?.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Deal</th><th>Instrument</th><th>Volume</th><th>Exit price</th><th>Net P&L</th></tr></thead><tbody>${a.snapshot.deals.map(d=>`<tr><td>${when(d.time)}</td><td>#${esc(d.ticket)}</td><td>${esc(d.symbol)}</td><td>${fmt(d.volume)}</td><td>${fmt(d.price)}</td><td class="${d.profit+d.commission+d.swap+d.fee>=0?'positive':'negative'}">${fmt(d.profit+d.commission+d.swap+d.fee)}</td></tr>`).join('')}</tbody></table></div>`:empty('No closed deals reported today','Verified exit deals will appear after your worker reads broker history.')}</section><section class="panel section-gap"><div class="panel-head"><h2>Execution history</h2><input class="search" id="trade-search" aria-label="Filter execution history" placeholder="Filter history…"></div>${jobs.length?`<div class="table-wrap"><table id="history-table"><thead><tr><th>Created</th><th>Instruction</th><th>Reference</th><th>Status</th><th>Broker result</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${when(j.created)}</td><td>${esc(j.payload.side||'')} ${esc(j.payload.action)}${j.payload.action==='entry'?`<small> · ${esc(j.payload.execution_mode||j.payload.order_type||'MARKET')} @ ${j.payload.entry==null?'current market':esc(j.payload.entry)}</small>`:''}</td><td class="mono">Trade #${esc((j.payload.signal_id||j.feed_id||j.id).slice(0,8).toUpperCase())}<details><summary>Technical reference</summary><small>Job ${esc(j.id)}${j.source_ref?` · Source ${esc(j.source_ref)}`:''}</small></details></td><td>${badge(j.state,j.state==='executed'?'':j.state==='uncertain'?'red':'gray')}</td><td>${eventDetail(j.result?.user_detail||j.result?.detail||({expired:'Expired before broker submission. Send a new current instruction if still intended.',cancelled:'Cancelled before broker submission.',claimed:'Broker worker is processing this command.'}[j.state]||'Awaiting worker response'))}${j.result?.ticket?` <small>· #${esc(j.result.ticket)}</small>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('No execution records yet','Signals and management commands will appear here as they are processed.')}</section>`}
function activity(){return `<div class="page-title"><div><div class="eyebrow">A CLEAR AUDIT TRAIL</div><h1>Workspace activity</h1><p>Account changes, risk updates, signals, and execution outcomes.</p></div>${button('Refresh','refresh','refresh')}</div><section class="panel">${data.events.length?data.events.map(e=>`<article class="notification">${icon(e.kind==='alert'?'alert':e.kind==='security'?'risk':'activity')}<div><strong>${esc(e.kind[0].toUpperCase()+e.kind.slice(1))}</strong>${eventDetail(e.detail)}<time>${when(e.created)}</time></div></article>`).join(''):empty('No activity yet','Your audit trail starts when you connect your first account.')}</section>`}
function billingPage(){const s=data.subscription;return `<div class="page-title"><div><div class="eyebrow">YOUR WORKSPACE MEMBERSHIP</div><h1>Plan & billing</h1><p>Subscription status is synchronized from verified payment events.</p></div>${button('Manage subscription','billing-portal','billing','',!config.billing_ready||s.status==='inactive'?'disabled':'')}</div>${!config.billing_ready?`<div class="banner">${icon('alert')}<span>${config.demo?'Demo workspace: payments are disabled.':'Billing is not configured. The operator must supply Stripe keys, price IDs, and a webhook endpoint before checkout becomes available.'}</span></div>`:''}<section class="panel"><div class="settings-list"><div class="row"><div><strong>Current membership</strong><p>${config.billing_enabled?'Access follows your verified subscription.':'This installation does not require a paid subscription.'}</p></div>${badge(config.billing_enabled?s.status:'Development access',config.billing_enabled?'':'demo')}</div><div class="row"><div><strong>${esc(s.plan==='free'?'No paid plan':s.plan.toUpperCase())}</strong><p>${s.period_end?'Current period ends '+when(s.period_end):'No billing period is active.'}</p></div><small>Hosted by your community operator</small></div></div></section><section class="cards section-gap">${['basic','pro'].map((p,i)=>`<article class="panel plan ${i?'featured':''}"><span class="plan-tag">${i?'EXTENDED WORKSPACE':'CORE WORKSPACE'}</span><h2>${i?'Pro':'Basic'}</h2><p>Price and renewal terms are shown at checkout.</p><ul><li>MT5 account execution</li><li>XAUUSD analyst feeds</li><li>Risk and trade controls</li><li>Execution history and activity</li></ul>${button('Continue to '+(i?'Pro':'Basic'),'checkout','arrow',i?'primary':'',`data-plan="${p}" ${!config.billing_ready?'disabled':''}`)}</article>`).join('')}</section><p class="section-note">Both plans currently expose the same execution features. Plan-specific quotas are not enabled. Account funds stay with your broker; subscription payments are handled separately by Stripe.</p>`}
function settings(){return `<div class="page-title"><div><div class="eyebrow">YOUR PROFILE & ENVIRONMENT</div><h1>Workspace settings</h1><p>Security, account access, and deployment status.</p></div></div><section class="panel settings-list"><div class="row"><div><strong>${esc(current.name)}</strong><p>${esc(current.email)}</p></div>${badge(current.role==='admin'?'Operator':'Member','gray')}</div><div class="row"><div><strong>Password & sessions</strong><p>Password resets revoke all active browser sessions.</p></div><a class="btn" href="#forgot">Reset password</a></div><div class="row"><div><strong>Execution environment</strong><p>${config.demo?'Demo workspace. Worker claims are disabled.':'Broker execution requires a connected worker.'}</p></div>${badge(config.live_enabled?'Live gate enabled':'Live gate disabled',config.live_enabled?'red':'demo')}</div><div class="row"><div><strong>Managed hosting</strong><p>Accounts are assigned to dedicated Windows terminal slots.</p></div>${badge(config.managed_available?'Supervisor configured':'Not configured',config.managed_available?'':'gray')}</div><div class="row"><div><strong>Account disconnection</strong><p>Disconnect or delete an account from its card. Broker trades remain unchanged.</p></div><a class="btn" href="#accounts">Manage accounts</a></div><div class="row"><div><strong>Service & privacy information</strong><p>Credentials are encrypted at rest; worker tokens can be revoked.</p></div><a class="btn" href="#legal">Read information</a></div></section>`}

function operatorPage(){if(!operator)return empty('Loading operator console','Fetching terminal assignments and unresolved executions.');return `<div class="page-title"><div><div class="eyebrow">COMMUNITY OPERATIONS</div><h1>Operator console</h1><p>Feed configuration, execution recovery, and service visibility.</p></div><div class="actions">${button(data.paused?'Resume platform':'Pause new entries','global-pause','pause',data.paused?'primary':'danger')}${button('Add analyst','add-analyst','plus','primary')}</div></div>${sourceSetupPanel()}<div class="operator-grid"><section class="panel"><div class="panel-head"><h2>Terminal assignments</h2><small>${operator.accounts.length} accounts</small></div>${operator.accounts.length?`<div class="table-wrap"><table><thead><tr><th>Account</th><th>Member</th><th>Hosting</th><th>Mode</th><th>Last heartbeat</th></tr></thead><tbody>${operator.accounts.map(a=>`<tr><td>${esc(a.name)} · ${esc(a.login)}</td><td>${esc(a.email)}</td><td>${esc(a.hosting)}</td><td>${badge(a.mode,a.mode==='live'?'red':'demo')}</td><td>${when(a.heartbeat)}</td></tr>`).join('')}</tbody></table></div>`:empty('No terminal assignments','Accounts will appear as members connect.')}</section><section class="panel"><div class="panel-head"><h2>Unresolved executions</h2>${badge(operator.unresolved.length+' require review',operator.unresolved.length?'red':'gray')}</div>${operator.unresolved.length?`<div class="table-wrap"><table><thead><tr><th>Job</th><th>Account</th><th>State</th><th>Action</th></tr></thead><tbody>${operator.unresolved.map(j=>`<tr><td class="mono">${esc(j.id.slice(0,12))}</td><td>${esc(j.account_id.slice(0,12))}</td><td>${badge(j.state,'red')}</td><td>${button('Reconcile','reconcile','check','small',`data-job="${j.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('No unresolved executions','Any interrupted submission is held for review; it is never automatically resubmitted.')}</section><section class="panel"><div class="panel-head"><h2>Analys function legal(){return `<main class="legal">${brand()}<h1 class="section-gap">Service & privacy information</h1><p>Gold Copier is independent execution software. It does not provide trading advice, custody funds, or guarantee profitable execution. The operator must publish their own complete terms, legal entity details, support contacts, retention policy, and subscription terms before accepting public customers.</p><h2>Credentials & access</h2><p>Browser sessions use HttpOnly cookies. Stored MT5 passwords are encrypted with AES-256-GCM using an operator-managed key. Authorized dedicated workers can decrypt and use credentials through the service. This is encryption at rest, not end-to-end encryption. Only connect an account to an operator you trust.</p><h2>Execution & risk</h2><p>Signals, account snapshots, execution records, and security events are retained in the operator’s database. Workers need uninterrupted terminal access for software-managed exits and breakeven. Disconnections and market gaps can cause missed or delayed actions, and stops can fill beyond their requested prices.</p><h2>Control</h2><p>Pause stops future entries and does not liquidate existing positions. Disconnection revokes worker access and stops automated trade management. Existing broker positions and orders remain open. Subscription cancellation is managed through the payment provider when configured.</p><a class="btn" href="${current?'#settings':'#home'}">${icon('arrow')}Return to workspace</a></main>`}

function guidedConnection(cid){

function guidedStatus(m){
  const b=m.bot, symbols=b.gold_symbols||[];
  const verified=b.heartbeat&&brokerNow()-b.heartbeat<30&&!b.disconnected&&!b.error;
  let status='Verifying your MT5 account';
  let detail='We’re connecting to your broker. This page updates automatically.';
  if(b.disconnected||b.error){
    status='Connection needs attention';
    detail=b.error||'The MT5 account was disconnected.';
  }else if(verified){
    status=symbols.length?'Account verified':'Gold symbol unavailable';
    detail=symbols.length?`Your ${b.mode==='live'?'live':'demo'} account is connected. Review your risk to start copying.`:'Your broker did not report a supported gold symbol. Check your account with your broker.';
  }else if(brokerNow()-(b.connection_created||b.created||brokerNow())>60){
    status='Waiting for hosted connection';
    detail='Your account is still waiting for a hosted MT5 terminal. Contact the service team if this persists.';
  }
  return `<h3>${status}</h3><p class="section-note">${esc(detail)}</p><div class="actions">${verified&&symbols.length?button('Review risk and start','community-review-risk','play','primary',`data-community="${esc(m.community_id)}"`):''}${b.error||b.disconnected?button('Replace connection','delete-account','close','',`data-account="${esc(b.account_id)}"`):''}</div>`;
}
function guidedReview(cid){
  const bot=communityData.memberships.find(m=>m.community_id===cid)?.bot;

  ${symbols.length>1?`<div class="field"><label for="guided-symbol">Gold symbol</label><select id="guided-symbol" name="symbol" required><option value="">Choose your broker’s gold symbol</option>${symbols.map(symbol=>`<option value="${esc(symbol)}">${esc(symbol)}</option>`).join('')}</select></div>`:`<p>Verified instrument: <strong>${esc(symbols[0]||'')}</strong></p>`}
  ${fieldsNumber('Risk per trade (%)','risk_pct',bot.risk_pct??0.5,'Each copied trade is sized using this percentage of your account equity.','.01','.01','2')}`
  ,'guided-start-form','Start copying');
}

function copyMemberCard(m){const bot=m.bot,connected=bot?.account_id,online=bot?.heartbeat&&brokerNow()-bot.heartbeat<30&&!bot.disconnected&&!bot.error;return `<section class="panel section-gap"><div class="panel-head"><div><h2>${esc(m.name)}</h2><small>Your master community</small></div>${badge(m.active?'Subscription active':membershipLabel(m),m.active?'':'demo')}</div><div class="panel-body">${!m.active?`<p>${esc(m.access_message||(m.access_mode==='stripe'?'Subscribe to this master to generate your personal child bot.':'Your master approves subscription access. Your private child bot is generated after approval.'))}</p><div class="actions section-gap">${m.access_mode==='stripe'&&m.master_available!==false&&!m.blocked?button(`Subscribe · ${money((m.expected_cents||m.monthly_cents)/100)}/month`,'community-subscribe','wallet','primary',`data-community="${m.community_id}"`):badge(m.access_mode==='manual'?'Waiting for master approval':'Subscription unavailable','gray')}</div>`:!connected?`<h3>Connect your MT5 account</h3><p class="section-note">Enter your MT5 server, login ID, and trading password. We host MT5 for you.</p>${button('Connect MT5','community-connect-child','link','primary',`data-community="${m.community_id}"`)}`:bot.guided?guidedStatus(m):`<h3>${esc(bot.account_name)}</h3><p class="section-note">${bot.error?esc(bot.error):bot.enabled&&online?'Copying is on. Your bot runs on our servers.':bot.enabled?'Your hosted MT5 connection is offline. New trades may be skipped.':bot.heartbeat?'Your child bot is paused.':(brokerNow()-(bot.connection_created||bot.created||brokerNow())>60?'Your bot is queued for a broker connection. The service team is checking availability.':'Your personal bot is connecting. This page updates automatically.')}</p><div class="actions">${badge(bot.enabled?(online?'Copying':'Offline'):bot.heartbeat?'Paused':'Connecting',bot.enabled&&online?'':'gray')}${button(bot.enabled?'Pause copying':'Resume copying','toggle-copy',bot.enabled?'pause':'play','',`data-account="${bot.account_id}" ${!bot.heartbeat?'disabled':''}`)}${button('My risk settings','account-risk','risk','',`data-account="${bot.account_id}"`)}<a class="btn" href="#trades">Live trades</a><a class="btn" href="#accounts">Broker connection settings</a></div>`}${m.access_mode==='stripe'?`<div class="actions section-gap">${button('Manage my subscription','community-portal','wallet','small',`data-community="${m.community_id}"`)}</div>`:''}</div></section>`;}
function communityCreateModal(){modal('Create your master community',`<p>Your parent bot will distribute your trades to each active subscriber's private child bot.</p><div class="field"><label for="community-name">Community name</label><input id="community-name" name="name" required minlength="2" maxlength="60" placeholder="My trading community"></div><div class="field section-gap"><label for="community-channel">Discord output channel</label><input id="community-channel" name="discord_channel" placeholder="Paste a Discord channel link (optional)"><small>Right-click your chosen channel and copy its link. This is where your trade signals are published.</small></div><div class="field section-gap"><label for="community-access">Subscriber access</label><select id="community-access" name="access_mode"><option value="manual">I approve my subscribers</option><option value="stripe" ${!communityData.payment_ready?'disabled':''}>Paid monthly subscriptions</option></select><small>Manual approval grants access without recording an in-app payment. Paid subscriptions activate only after payment verification.</small></div>${fieldsNumber('Monthly subscription price (USD)','monthly_price',25,'Used for paid monthly subscriptions.','.01','1','10000')}`,'community-create-form','Create parent bot');}
function communityBrokerModal(cid,master,connector='mt5'){const c=communityData.masters.find(c=>c.id===cid);const own=data.accounts.filter(a=>!a.child_bot&&(a.purpose!=='master'||!a.master_source));modal(master?'Connect your master account':'Connect your personal copy bot',`<p>${master?'The parent bot observes this trading account. You place trades normally in MT5 or your broker.':'Your child bot runs privately in the background. It copies only your subscribed master.'}</p>${master&&own.length?`<div class="field"><label for="community-existing">Use an account already connected</label><select id="community-existing"><option value="">Connect a new account</option>${own.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${esc(a.login)}</option>`).join('')}</select>${button('Use selected account','community-use-existing','link','small',`data-community="${cid}"`)}</div>`:''}<input type="hidden" name="community_id" value="${cid}"><input type="hidden" name="master" value="${master?'true':'false'}"><input type="hidden" name="connector" value="${connector}"><input type="hidden" name="name" value="${esc((master?(c?.name||'Master')+' parent':'My personal copy bot').slice(0,60))}"><div class="field section-gap"><label for="community-connector">Broker connection</label><select id="community-connector" data-community="${cid}" data-master="${master}"><option value="mt5" ${connector==='mt5'?'selected':''}>MT5 (including Exness MT5)</option><option value="exness" ${connector==='exness'?'selected':''}>Eligible Exness API account</option></select></div>${connector==='mt5'?`<div class="form-grid section-gap"><div class="field"><label for="community-broker">Broker</label><select id="community-broker" name="broker"><option>Exness</option><option>PrimeXBT</option><option>Other MT5</option></select></div><div class="field"><label for="community-mode">Account type</label><select id="community-mode" name="mode"><option value="demo">Demo</option><option value="live" ${!master&&!config.live_enabled?'disabled':''}>Live</option></select></div><div class="field"><label for="community-login">Broker account login</label><input id="community-login" name="login" inputmode="numeric" pattern="[0-9]{3,20}" required></div><div class="field"><label for="community-server">Broker server</label><input id="community-server" name="server" required placeholder="As shown in MT5"></div><div class="field"><label for="community-password">${master?'Read-only / investor password':'Trading password'}</label><input id="community-password" name="password" type="password" autocomplete="off" required></div><div class="field"><label for="community-symbol">Broker gold symbol</label><input id="community-symbol" name="symbol" value="XAUUSD" required><small>For example XAUUSD or XAUUSDm, exactly as shown by your broker.</small></div></div>${!communityData.managed_available?'<p class="section-note">Hosted MT5 connections are awaiting service setup. You can use an already connected account above or try again when hosting is available.</p>':''}`:`<div class="form-grid section-gap">${[['account_id','Exness account ID'],['gateway','Gateway URL from Exness Key Management'],['api_key','API key identifier']].map(([name,label])=>`<div class="field wide"><label for="community-${name}">${label}</label><input id="community-${name}" name="${name}" required autocomplete="off"></div>`).join('')}<div class="field wide"><label for="community-private">Private signing key</label><textarea id="community-private" name="private_key" required></textarea><small>Use an API-eligible account. Regular Exness MT5 accounts use the MT5 connection option.</small></div></div>`}<p class="section-note">${master?'Use read-only access where your broker supports it. The parent bot never trades on the master account.':'Initial risk cap: 0.5% per trade, maximum 2 open trades and 0.1 lots. Review or pause these settings from My risk settings.'}</p><div class="field check section-gap"><input id="community-consent" type="checkbox" required><label for="community-consent">I own or am authorized to connect this account and consent to ${master?'read-only trade observation':'automatic copying within my risk limits'}.</label></div>`,'community-broker-form',master?'Connect parent bot':'Activate my child bot');}
function joinLanding(invite,token){return `<main class="legal">${brand()}<div class="eyebrow section-gap">INVITATION FROM YOUR MASTER</div><h1>${esc(invite.name)}</h1><p class="section-gap">${invite.access_mode==='stripe'?`${money(invite.monthly_cents/100)} per month`:'Subscription access approved by the master'}. Your personal child bot copies this master's trades to your own broker account.</p><p class="section-note">Your master publishes signals to their Discord channel. Your child bot receives copy instructions automatically; you do not type the signals again.</p><div class="actions section-gap">${current?button('Join this master','community-join','link','primary',`data-token="${esc(token)}"`):'<a class="btn primary" href="#signup">Create my account</a><a class="btn" href="#login">Sign in</a>'}</div></main>`;}

const titles={community:'Community',overview:'Overview',accounts:'Accounts',pairs:'Trading pairs',analysts:'Analysts',risk:'Risk & execution',trades:'Trades & orders',activity:'Activity',billing:'Plan & billing',settings:'Settings',operator:'Operator console'};
function shell(body){return `<aside class="sidebar">${brand()}<p class="nav-label">WORKSPACE</p><nav class="nav">${(data.persona==='subscriber'?['community','overview','trades','risk','activity']:data.persona==='master'?['community','overview','accounts','pairs','trades','activity']:['community','overview','accounts','pairs','analysts','risk','trades','activity']).map(p=>`<a href="#${p}" class="${activePage===p?'active':''}">${icon(p)}${titles[p]}${p==='trades'&&account()?.snapshot.positions?.length?`<span class="pill">${account().snapshot.positions.length}</span>`:''}</a>`).join('')}</nav><p class="nav-label section-gap">MANAGE</p><nav class="nav">${['billing','settings',...(current.role==='admin'?['operator']:[])].map(p=>`<a href="#${p}" class="${activePage===p?'active':''}">${icon(p==='operator'?'risk':p)}${titles[p]}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="nav-card"><strong>A little clarity goes a long way.</strong><p>Set your risk before starting. Your boundaries come first.</p><a href="#risk">Review risk settings →</a></div><div class="user-panel"><span class="avatar">${esc(initials(current.name))}</span><div><strong>${esc(current.name)}</strong><small>${current.role==='admin'?'Community operator':'Member workspace'}</small></div><button data-action="logout" aria-label="Sign out">${icon('logout')}</button></div></div></aside><div class="shell"><header class="topbar"><div class="breadcrumb"><button class="mobile-nav" data-action="menu" aria-label="Toggle navigation">${icon('menu')}</button><span>Workspace</span>${icon('chevron')}<strong>${titles[activePage]||'Overview'}</strong></div><div class="top-right"><a href="#settings" aria-label="Open profile">Profile</a>${button(publicDemo?'Exit demo':'Sign out','logout','logout','small')}${badge(config.demo?'Demo environment':'MT5 workspace',config.demo?'demo':'gray')}<time>${new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</time><a href="#activity" aria-label="Open activity">${icon('bell')}</a></div></header><main class="content">${body}<footer class="footer"><span>Gold Copier · Community execution</span><span>${config.demo?'Seeded sample data · No broker execution':'Risk settings cannot guarantee execution or prevent all losses.'}</span></footer></main></div>`}
async function refresh(render=true){const generation=portfolioGeneration,identity=current?.id,page=activePage;const valid=()=>generation===portfolioGeneration&&current&&current.id===identity;const next=publicDemo?(await api('/demo')).dashboard:await api('/dashboard');if(!valid())return;data=next;if(!account())selected=null;if(page==='operator'&&current.role==='admin'){const value=await api('/operator/status');if(!valid())return;operator=value;}if(page==='community'){const value=publicDemo||config.demo?sampleCommunity():await api('/community');if(!valid())return;communityData=value;if(value.server_time)serverClockOffset=value.server_time-Date.now()/1000;const payment=localStorage.getItem('gold-payment-refresh');if(payment&&value.masters.some(c=>c.id===payment)){localStorage.removeItem('gold-payment-refresh');await post(`/communities/${payment}/payments/refresh`);const updated=await api('/community');if(!valid())return;communityData=updated;}}await loadEquity();if(!valid())return;appendLiveEquity();if(render&&page===activePage)renderWorkspace();}
function renderWorkspace(){const views={community:communityPage,overview,accounts,pairs:pairsPage,analysts,risk:riskPage,trades,activity,billing:billingPage,settings,operator:operatorPage};$('#app').innerHTML=shell((views[activePage]||overview)());syncPortfolioStream()}
async function route(){const p=location.hash.slice(1).split('/')[0]||'home';if(p==='join'){stopPortfolioStream();const token=location.hash.split('/')[1]||'';localStorage.setItem('gold-community-invite',token);try{const invite=await api('/communities/invites/'+encodeURIComponent(token));$('#app').innerHTML=joinLanding(invite,token);}catch(e){toast(e.message,true)}return;}if(['how','legal','forgot','reset'].includes(p)){activePage=p;stopPortfolioStream();}if(current&&!publicDemo&&['home','login','signup','demo'].includes(p)){location.hash='community';return}if(p==='demo'){try{const r=await api('/demo');publicDemo=true;current=r.user;data=r.dashboard;activePage='overview';renderWorkspace()}catch(e){toast(e.message,true)}return}if(p==='home'){location.hash=publicDemo?'demo':'login';return}if(['how','legal'].includes(p)){if(p==='legal')$('#app').innerHTML=legal();else{$('#app').innerHTML=landing();if(p==='how')$('#how')?.scrollIntoView({behavior:'smooth'})}return}if(['login','signup','forgot','reset'].includes(p)){if(publicDemo)clearSession();$('#app').innerHTML=authPage(p);return}if(!current){location.hash='login';return}activePage=titles[p]?p:'overview';try{await refresh()}catch(e){toast(e.message,true)}}
function connectModal(){modal('Connect an MT5 account',`<div class="steps"><span>01 Account details</span><span>02 ${config.local_worker_available?'Connect MT5':'Worker setup'}</span><span>03 Verify & start</span></div><p>${config.local_worker_available?'Enter your MT5 account details. The server connects automatically.':'Add your account details, then connect its Windows worker.'}</p><div class="form-grid">${current.role==='admin'?'<div class="field wide"><label for="purpose">Account purpose</label><select id="purpose" name="purpose"><option value="follower">Follower — copies the trader</option><option value="master">Trader source — read-only observation</option></select></div>':''}<div class="field wide"><label for="account-name">Account name</label><input id="account-name" name="name" required minlength="2" maxlength="60" placeholder="My gold account"></div><div class="field"><label for="broker">Broker</label><select id="broker" name="broker"><option>Exness</option><option>PrimeXBT</option><option>Other MT5</option></select></div><div class="field"><label for="mode">Account type</label><select id="mode" name="mode"><option value="demo">Demo account</option>${config.live_enabled||current.role==='admin'?'<option value="live">Live account (source only while follower live gate is off)</option>':''}</select></div><div class="field"><label for="login">MT5 login</label><input id="login" name="login" inputmode="numeric" pattern="[0-9]{3,20}" required placeholder="12345678"></div><div class="field"><label for="server">Broker server</label><input id="server" name="server" required placeholder="Exact MT5 server name"></div><div class="field"><label for="symbol">Default broker symbol</label><input id="symbol" name="symbol" value="XAUUSD" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,31}" required><small>Configure additional symbols in Trading pairs.</small></div><div class="field"><label for="hosting">Connection</label><select id="hosting" name="hosting"><option value="self">${config.local_worker_available?'This computer (automatic)':'My Windows computer'}</option>${config.managed_available&&!config.demo?'<option value="managed">Community managed hosting</option>':''}</select></div><div class="field wide" id="broker-password-field" hidden><label for="broker-password">MT5 trading password</label><input id="broker-password" name="password" type="password" autocomplete="off"><small>Encrypted at rest. The operator’s managed worker can access it to connect MT5.</small></div>${data.analysts.some(p=>p.active)?`<div class="field wide"><label for="connect-analyst">Copy signals from</label><select id="connect-analyst" name="analyst_id" required>${data.analysts.filter(p=>p.active).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><small>Copying stays paused until you click Start copying.</small></div>`:'<p class="section-note wide">No analyst is configured yet. Add your Discord source in .env or Operator console before copying.</p>'}<div class="field check wide"><input id="consent" name="consent" type="checkbox" required><label for="consent">I own this account and authorize execution according to my settings.</label></div></div>`,'connect-form','Connect MT5')}
function workerModal(id){const a=data.accounts.find(x=>x.id===id);if(a.connector==='exness'){selected=id;modal('Exness API worker',`<p>Run the same durable worker on any supported Python host. MT5 is not required. Set COPIER_URL and this account’s AGENT_TOKEN, then run <code>python -m goldcopier.platform_agent</code>. Start with live execution disabled to verify account data and instruments.</p>${button('Generate worker token','issue-token','link','primary',`data-account="${a.id}"`)}`);return}selected=id;localStorage.setItem('gold-account',id);if(autoLocal(a)){activePage='accounts';location.hash='accounts';renderWorkspace();return}renderWorkspace();modal('Worker setup',`<p>${a.hosting==='managed'?'This account is queued for the operator’s managed terminal pool. A terminal slot and Windows supervisor must be running.':'Install the project on a Windows machine with a dedicated MT5 terminal. Generate a token below, then follow docs/PLATFORM.md.'}</p><ol class="checklist"><li>Use a dedicated hedging account and terminal installation.</li><li>Run <code>python -m goldcopier.platform_agent</code> with the service URL, worker token, and terminal path.</li><li>Wait for the verified heartbeat, follow an analyst, then start copying.</li></ol><p class="section-note">Generating a new token pauses copying and invalidates the previous worker token. Open positions are not closed.</p>${button('Generate worker token','issue-token','link','primary',`data-account="${a.id}"`)}`)}
function manageModal(ticket,cancel=false){modal(cancel?'Cancel pending order':'Manage position',`<p>Request a broker action for ticket #${esc(ticket)}. The worker will validate ownership and report the actual result. Queued does not mean executed.</p><input type="hidden" name="account_id" value="${esc(account().id)}"><input type="hidden" name="position" value="${esc(ticket)}"><div class="form-grid"><div class="field wide"><label for="action">Action</label><select id="action" name="action">${cancel?'<option value="cancel">Cancel pending order</option>':'<option value="breakeven">Move SL to actual entry</option><option value="modify">Edit stop loss / take profit</option><option value="partial">Partial close</option><option value="close">Close entire position</option>'}</select></div><div class="field"><label for="command-sl">New stop loss (optional)</label><input id="command-sl" name="sl" type="number" min="0.0000000001" step="any"></div><div class="field"><label for="command-tp">New take profit (optional)</label><input id="command-tp" name="tp" type="number" min="0.0000000001" step="any"></div><div class="field"><label for="percent">Partial close (%)</label><input id="percent" name="percent" type="number" min="1" max="100" value="50"></div><div class="field check wide"><input id="confirm-command" type="checkbox" required><label for="confirm-command">I reviewed this action and want the worker to submit it.</label></div></div>`,'command-form','Queue broker action')}
async function action(target){const name=target.dataset.action,a=account();if(name.startsWith('community-')){await communityAction(target);return;}switch(name){case'dismiss-toast':hideToast();break;case'toggle-password':{const input=$('#password'),show=input.type==='password';input.type=show?'text':'password';target.setAttribute('aria-label',show?'Hide password':'Show password');target.setAttribute('aria-pressed',String(show));break}case'add-pair':pairModal();break;case'edit-pair':pairModal(target.dataset.pair);break;case'map-pair':mappingModal();break;case'edit-mapping':mappingModal(target.dataset.pair);break;
case'delete-pair':modal('Delete pair',`<p>Delete ${esc(target.dataset.pair)} and its account mappings? Active exposure blocks deletion.</p>${button('Delete','confirm-delete-pair','','danger',`data-pair="${esc(target.dataset.pair)}"`)}`);break;
case'confirm-delete-pair':await api('/operator/pairs/'+encodeURIComponent(target.dataset.pair),{method:'DELETE'});$('#modal').close();await refresh();toast('Pair deleted');break;
case'delete-mapping':modal('Delete mapping',`<p>Future signals for ${esc(target.dataset.pair)} will be skipped for this account.</p>${button('Delete','confirm-delete-mapping','','danger',`data-pair="${esc(target.dataset.pair)}"`)}`);break;
case'confirm-delete-mapping':await api(`/accounts/${a.id}/pairs/${encodeURIComponent(target.dataset.pair)}`,{method:'DELETE'});$('#modal').close();await refresh();toast('Mapping deleted');break;
case'source-accounts':$('#modal').close();location.hash='accounts';break;case'source-setup':{if(!operator&&current.role==='admin')operator=await api('/operator/status');sourceSetupModal(target.dataset.account);break;}case'connect-exness':exnessModal();break;case'dismiss':$('#modal').close();break;case'menu':$('.sidebar')?.classList.toggle('open');break;case'refresh':await refresh();toast('Workspace refreshed');break;case'connect':connectModal();break;case'logout':if(!publicDemo)await post('/auth/logout');clearSession();location.hash='login';await route();break;case'worker-setup':workerModal(target.dataset.account);break;case'issue-token':{const r=await post(`/accounts/${target.dataset.account}/token`);modal('Save your worker token',`<p>This token is shown once. Store it in the worker’s environment, never in GitHub or chat.</p><div class="token" id="worker-token">${esc(r.token)}</div><p class="section-note">Copying has been paused. Start it again after the worker verifies its connection.</p>${button('Copy token','copy-token','link','primary')}`);await refresh();break}case'copy-token':await navigator.clipboard.writeText($('#worker-token').textContent);toast('Token copied');break;case'account-risk':selected=target.dataset.account;localStorage.setItem('gold-account',selected);location.hash='risk';break;case'toggle-copy':{const chosen=data.accounts.find(x=>x.id===(target.dataset.account||a?.id));if(!chosen)throw Error('Choose an MT5 account first');await post(`/accounts/${chosen.id}/enabled`,{enabled:!chosen.enabled});await refresh();toast(chosen.enabled?'New entries paused':'Copying started. Waiting for the next valid signal.');break;}case'follow':{const id=target.dataset.analyst,enabled=!a.follows.some(f=>f.analyst_id===id);await post(`/accounts/${a.id}/analysts/${id}`,{enabled});await refresh();toast(enabled?'Analyst followed':'Analyst unfollowed');break}case'manage':manageModal(target.dataset.ticket);break;case'cancel-order':manageModal(target.dataset.ticket,true);br al('Add analyst feed',`<p>Direct broker mode needs no Discord input. For Discord message mode, enter the exact guild, channel and author IDs.</p><div class="field"><label for="analyst-source-mode">Signal source</label><select id="analyst-source-mode" name="source_mode"><option value="broker">Direct broker copying (recommended)</option><option value="discord">Read Discord messages</option></select></div><div class="form-grid"><div class="field wide"><label for="analyst-name">Display name</label><input id="analyst-name" name="name" required minlength="2"></div><div class="field wide"><label for="description">Description</label><input id="description" name="description" maxlength="300"></div>${['guild_id','channel_id','trader_id'].map(k=>`<div class="field"><label for="${k}">${k.replaceAll('_',' ')}</label><input id="${k}" name="${k}" inputmode="numeric" pattern="[0-9]{1,24}" data-discord-id></div>`).join('')}</div>`,'analyst-form','Add analyst');break;case'analyst-toggle':await post(`/operator/analysts/${target.dataset.analyst}/enabled`,{enabled:target.dataset.enabled==='true'});await refresh();break;case'reconcile':modal('Reconcile execution',`<p>Review the actual MT5 orders, positions, and deal history first. This records your conclusion and never resubmits an order.</p><input type="hidden" name="job" value="${esc(target.dataset.job)}"><div class="field"><label for="resolution">Verified outcome</label><select name="state" id="resolution"><option value="executed">Executed at broker</option><option value="rejected">Not executed at broker</option></select></div><div class="field section-gap"><label for="note">Evidence / reconciliation note</label><textarea name="note" id="note" required minlength="12" maxlength="500" placeholder="Broker order/deal IDs and what you verified"></textarea></div><div class="field check section-gap"><input id="reconcile-confirm" type="checkbox" required><label for="reconcile-confirm">I checked the broker records and stopped any stale worker. inal?'PUT':'POST',body:{symbol:v.symbol.toUpperCase(),name:v.name,aliases:v.aliases.split(',').map(x=>x.trim()).filter(Boolean),enabled:form.elements.namedItem('enabled').checked}});$('#modal').close();await refresh();toast('Pair saved');break}

d queued. Check execution history for the broker outcome.');break}case'analyst-form':await post('/operator/analysts',v);$('#modal').close();await refresh();toast('Authorized analyst added');break;case'resolve-form':await post(`/operator/jobs/${v.job}/resolve`,{state:v.state,note:v.note});$('#modal').close();await refresh();toast('Reconciliation recorded; no order was resubmitted');break;case'signal-form':{const r=await post('/operator/signals',{...v,created:Date.now()/1000});$('#modal').close();await refresh();toast(r.duplicate?'Already processed. Check Activity and Execution history; no second copy was sent.':`Signal accepted; ${r.queued} follower commands queued${r.skipped?.length?'; skipped: '+[...new Set(r.skipped.map(x=>x.reason))].join('; '): ''}`);break}}}catch(err){const el=form.querySelector('#auth-error');if(el){el.textContent=err.message;el.hidden=false}else toast(err.message,true)}finally{if(button)button.disabled=false}});
